project:
  name: galv_ike2008_noaa_sg
  output_dir: /home/fmaghsoodifar/SFINCS-MOM6/AutoCF-1.0.0-HPC/AutoCF_release_v1.0.0/runs/galv_ike2008_noaa_sg
  cache_dir: /home/fmaghsoodifar/SFINCS-MOM6/AutoCF-1.0.0-HPC/AutoCF_release_v1.0.0/cache
  overwrite: false
  layout_version: 2
geojson:
  path: /home/fmaghsoodifar/SFINCS-MOM6/AutoCF-1.0.0-HPC/AutoCF_release_v1.0.0/data/galveston/region_bbox.geojson
workflow:
  mode: build_only
  require_internet_for_build: true
simulation:
  event_name: Ike_2008
  time_zone: UTC
  start: '2008-09-08T00:00:00Z'
  end: '2008-09-16T00:00:00Z'
model:
  mode: subgrid
mesh:
  type: regular
  dx_m: 200.0
  crs: utm
  rotated: false
  subgrid: true
topobathy:
  target_vertical_datum: NAVD88
  datum_policy: align_gapfill
  datum_engine: auto
  buffer_km: 10
  primary:
    source: NOAA_CUDEM_1_9_ARCSEC
    output_resolution_m: 10
    vertical_datum: NAVD88
  gapfill:
    source: GEBCO_2024_15_ARCSEC
    cog_url: https://s3.us-west-2.amazonaws.com/us-west-2.opendata.source.coop/alexgleith/gebco-2024/GEBCO_2024.tif
    output_resolution_m: 500
    vertical_datum: MSL
landcover:
  source: ESA_WorldCover_2021_v200
  resolution_m: 10
  tile_url_template: https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_{tile}_Map.tif
  buffer_km: 10
  manning_mapping: default_esa_worldcover
subgrid:
  nlevels: 10
  nr_subgrid_pixels: 20
  nrmax: 2000
  buffer_cells: 0
  huthresh: 0.01
  manning_land: 0.04
  manning_sea: 0.02
  rgh_lev_land: 0.0
  landcover_output_resolution_m: 10
  write_dep_tif: true
  write_man_tif: true
  q_table_option: 2
  weight_option: min
infiltration:
  method: cn
  source: gcn250
  antecedent_moisture: avg
  enabled: true
forcing:
  precipitation:
    source: aorc
  wind:
    source: aorc
  pressure:
    source: aorc
  ocean_boundary:
    source: noaa_coops
    datum: NAVD
    units: metric
    time_zone: gmt
    interval_minutes: 6
    max_station_distance_km: 150
    max_missing_fraction: 0.1
  river:
    source: usgs_auto
    parameter_cd: '00060'
    max_gage_distance_km: 50
    max_missing_fraction: 0.25
    unit_mult: 0.028316846592
    interval_minutes: 15
    max_gages: 12
    max_sources: 12
    min_upstream_area_km2: 500.0
    system_version: version_4_0
    product_type: consolidated
atmosphere:
  source: ERA5
  cache_subdir: era5
  cds_dataset: reanalysis-era5-single-levels
  spatial_buffer_degrees: 0.5
  variables:
    wind_u:
      era5_name: 10m_u_component_of_wind
      raw_short_name: u10
      final_name: wind_u
      unit_mult: 1.0
      unit_add: 0.0
      valid_min: -100.0
      valid_max: 100.0
    wind_v:
      era5_name: 10m_v_component_of_wind
      raw_short_name: v10
      final_name: wind_v
      unit_mult: 1.0
      unit_add: 0.0
      valid_min: -100.0
      valid_max: 100.0
    pressure:
      era5_name: mean_sea_level_pressure
      raw_short_name: msl
      final_name: press
      unit_mult: 1.0
      unit_add: 0.0
      valid_min: 85000.0
      valid_max: 110000.0
    precipitation:
      era5_name: total_precipitation
      raw_short_name: tp
      final_name: precip
      unit_mult: 1000.0
      unit_add: 0.0
      valid_min: 0.0
      valid_max: 500.0
  precip_cumulative_input: true
aorc:
  bucket: noaa-nws-aorc-v1-1-1km
  cache_subdir: aorc
  spatial_buffer_degrees: 0.5
noaa_boundary:
  source: NOAA_COOPS
  product: water_level
  datum: NAVD
  units: metric
  time_zone: gmt
  interval_minutes: 6
  max_station_distance_km: 150
  max_missing_fraction: 0.1
  min_valid_fraction: 0.9
evaluation:
  observations:
    source: file
    locations: /home/fmaghsoodifar/SFINCS-MOM6/AutoCF-1.0.0-HPC/AutoCF_release_v1.0.0/runs/galv_ike2008_noaa_sg/data/validation/water_level/stations.geojson
noaa_validation:
  enabled: false
  source: NOAA_COOPS
  product: water_level
  datum: NAVD
  units: metric
  time_zone: gmt
  interval_minutes: 6
  station_selection: all_inside_domain
  max_missing_fraction: 0.2
usgs_rivers:
  enabled: true
  source: USGS_NWIS
  parameter_cd: '00060'
  max_gage_distance_km: 50
  max_missing_fraction: 0.25
  unit_mult: 0.028316846592
  interval_minutes: 15
  max_gages: 12
external_validation:
  strict: false
  high_water_marks:
    enabled: true
    source: usgs_stn
    domain_buffer_km: 5
    accepted_qualities:
    - excellent
    - good
    - fair
    datum_policy: require_match
    vertical_datum_offset_m: null
hydromt:
  use_hydromt_cli: true
  build_verbosity: -vv
  active_zmin_m: -50.0
  active_zmax_m: 20.0
  boundary_include_buffer_m: 600.0
  boundary_zmax_m: 5.0
  boundary_point_spacing_m: 5000.0
sfincs:
  executable: /usr/local/bin/sfincs-cpu
  input_file: sfincs.inp
  dtout_seconds: 3600
  dthisout_seconds: 360
  dtmaxout_seconds: 3600
  outputformat: net
  inputformat: bin
  additional_parameters:
    advection: 1
    alpha: 0.5
    huthresh: 0.05
    theta: 1.0
    qinf: 0.0
    viscosity: 1
    storecumprcp: 1
    storevelmax: 1
postprocess:
  hmax_variable_candidates:
  - hmax
  - zsmax
  - max_water_depth
  make_hmax_png: true
  make_hmax_tif: true
_autocf:
  schema_version: 2
  canonical_config: /home/fmaghsoodifar/SFINCS-MOM6/AutoCF-1.0.0-HPC/AutoCF_release_v1.0.0/projects/galveston_ike2008_subgrid.yml
  remote_sensing_validation: disabled_by_design
